# Netlify-Konfiguration
# Damit muss im Netlify-Dashboard nichts von Hand eingestellt werden.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-Page-App: alle Pfade an index.html weiterreichen,
# damit die eigene 404-Seite greift statt der von Netlify.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Bilder, Video und PDF lange cachen — die Dateinamen aendern
# sich beim Austausch ohnehin.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# index.html nie cachen, sonst sehen Besucher alte Staende.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
